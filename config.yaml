# The InterImm Book (book.interimm.org). Built with Hugo (see .github/workflows/deploy.yml).
# Header, footer, colours and fonts come from the shared InterImm kit at https://interimm.org/kit/,
# so the book looks like interimm.org and picks up its menu. Layouts are in layouts/, book order in data/book.yml.
baseURL: "https://book.interimm.org/"
languageCode: "zh-CN"
title: "《星际移民之书》"
defaultContentLanguage: "cn"
enableRobotsTXT: true

taxonomies:
  category: categories
  keyword: keywords
  tag: tags

languages:
  cn:
    languageName: 中文
    weight: 1
    contentDir: content/cn
    params:
      editURL: "https://github.com/InterImm/InterImmBook/edit/master/content/cn/"
  en:
    languageName: English
    languageCode: en
    weight: 2
    title: The InterImm Book
    contentDir: content/en
    params:
      description: "The Book of Interplanetary Immigration tells the history of human explorations of the solar system."
      home:
        primary_button:
          title: Read Now
          link: /intro
      tags:
        - "History"
        - "Technology"
      editURL: "https://github.com/InterImm/InterImmBook/edit/master/content/en/"

params:
  description: "星际移民之书是由星际移民中心维护的一本关于人类太空文明历史的开源书籍，本书涵盖了了星际移民的历史、科技和人文等各个方面。"
  home:
    primary_button:
      title: 开始阅读
      link: /intro
  tags:
    - "历史"
    - "科技"
    - "人文"
  author: "InterImm"
  github: "InterImm/InterImmBook"
  feedback: "https://github.com/InterImm/InterImmBook/issues"

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["$$", "$$"]]
          inline: [["\\(", "\\)"]]
